name: Validate and Test

on:
  workflow_dispatch:
  pull_request:
    branches:
    - '*'
  push:
    branches:
    - '*'
  release:
    types:
      - published

jobs:
  black:
    name: black
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        version: '0.13.4'
        python-version: '3.13'
    - name: Lint with black
      run: |
        uv tool run black --version
        uv tool run black --check --diff .
  flake8:
    name: flake8
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        version: '0.13.4'
        python-version: '3.13'
    - name: Lint with flake8
      run: |
        uv tool run flake8 --version
        uv tool run flake8
  isort:
    name: isort
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        version: '0.13.4'
        python-version: '3.13'
    - name: Lint with isort
      run: uv tool run --from 'isort[colors]' isort --check --diff .

  ubuntu:
    name: Ubuntu Python ${{ matrix.python-version }}
    needs: [isort, black, flake8]
    defaults:
      run:
        shell: bash
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@v6
    - name: Set up uv and Python
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        version: '0.13.4'
        python-version: ${{ matrix.python-version }}
        activate-environment: true
    - name: Build and install test dependencies
      run: uv pip install -e . pytest
    - name: Test with pytest
      run: python -m pytest tests --doctest-glob='*.txt'
