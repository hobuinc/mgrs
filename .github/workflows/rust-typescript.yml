name: Rust and TypeScript

# Run without path filters so this can be required for PRs and merge queues.
on:
  pull_request:
  merge_group:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-typescript-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.90.0 fmt --all --check
      - run: cargo +1.90.0 clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo +1.90.0 test --workspace --all-features --locked
      - name: Verify standalone Cargo package
        run: |
          cargo +1.90.0 package -p mgrs-geotrans --locked
          cargo +1.90.0 test --manifest-path target/package/mgrs-geotrans-*/Cargo.toml --all-features --locked
      - name: Exercise performance path
        run: cargo +1.90.0 run --release --locked --example benchmark -- --points 1000 --repeats 1 --output benchmarks/results/rust-smoke.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-package-${{ matrix.os }}
          path: |
            target/package/*.crate
            benchmarks/results/rust-smoke.json
          if-no-files-found: warn
          retention-days: 7

  msrv:
    name: Rust minimum supported version (1.85)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --workspace --all-targets --all-features --locked

  wasm:
    name: Build WebAssembly package and test Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - name: Install WebAssembly toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.90.0
          cargo install wasm-bindgen-cli --version 0.2.105 --locked
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - name: Check generated notices match committed sources
        run: git diff --exit-code -- LICENSE NOTICE
      - run: npx playwright install --with-deps chromium
      - name: Browser conformance, workers and performance smoke test
        run: |
          mkdir -p ../benchmarks/results
          node test/browser.mjs --benchmark --points 1000 --repeats 1 > ../benchmarks/results/browser-smoke.json
      - name: Build npm tarball
        run: |
          mkdir -p "$RUNNER_TEMP/mgrs-package"
          npm pack --pack-destination "$RUNNER_TEMP/mgrs-package"
      - uses: actions/upload-artifact@v7
        with:
          name: mgrs-npm-package
          path: ${{ runner.temp }}/mgrs-package/*.tgz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-smoke
          path: benchmarks/results/browser-smoke.json
          if-no-files-found: warn
          retention-days: 7

  node:
    name: Node ${{ matrix.node }} (${{ matrix.os }})
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: mgrs-npm-package
          path: ${{ runner.temp }}/mgrs-package
      - run: npm ci
      # All platforms consume the same package; these jobs need no Rust build.
      - name: Install built assets into the test checkout
        # GNU tar in Git Bash treats the D: in Windows paths as a remote host.
        # Let the shell open the archive; stdin also works with BSD tar on macOS.
        run: tar -xzf - --strip-components=1 < "$RUNNER_TEMP"/mgrs-package/*.tgz
      - run: npm run test:node
      - name: Test standalone installation and TypeScript declarations
        run: npm run test:package -- "$RUNNER_TEMP"/mgrs-package/*.tgz
      - name: Exercise Node performance path
        run: npm run bench -- --points 1000 --repeats 1 --output ../benchmarks/results/node-smoke.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: node-smoke-${{ matrix.os }}-${{ matrix.node }}
          path: benchmarks/results/node-smoke.json
          if-no-files-found: warn
          retention-days: 7
