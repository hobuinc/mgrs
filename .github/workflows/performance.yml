name: Performance

# Keep PRs unfiltered so this can be a required status check, including for
# documentation-only changes. No schedule or model-driven monitoring.
on:
  pull_request:
  merge_group:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Baseline branch, tag, or SHA (empty uses the default branch)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: performance-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    name: Performance regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONHASHSEED: '0'
      PYTHONUNBUFFERED: '1'
      CC: gcc
      CFLAGS: '-O3 -DNDEBUG'

    steps:
      # On pull_request, github.sha is the proposed merge commit. Test the
      # result contributors intend to merge against the target branch SHA.
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false

      - name: Check out baseline
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || inputs.baseline_ref || github.event.before || github.event.repository.default_branch }}
          path: baseline
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install shared build tools
        run: python -m pip install -r candidate/benchmarks/requirements-ci.txt

      - name: Record toolchain
        run: |
          python --version
          python -m pip freeze > toolchain.txt
          gcc --version >> toolchain.txt
          lscpu >> toolchain.txt
          printf '\nCFLAGS=%s\nImageOS=%s\nImageVersion=%s\n' \
            "$CFLAGS" "$ImageOS" "$ImageVersion" >> toolchain.txt

      # Build both before timing and use separate source trees. Installing
      # both as editable packages in one environment can select the wrong one.
      - name: Build baseline
        working-directory: baseline
        run: python setup.py build_ext --inplace --force

      - name: Build candidate
        working-directory: candidate
        run: python setup.py build_ext --inplace --force

      - name: Test harness and conversions
        working-directory: candidate
        run: python -m pytest tests --doctest-glob='*.txt'

      - name: Compare one million global points
        working-directory: candidate
        run: |
          python -m benchmarks.ci \
            --base ../baseline --candidate . --output ../performance \
            --points 1000000 --repeats 5 --max-regression 10 \
            2>&1 | tee ../performance.log

      - name: Publish summary
        if: always()
        run: |
          if [[ -f performance/summary.md ]]; then
            cat performance/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Performance comparison did not complete. Check the build and test logs.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain measurements and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            performance/*.json
            performance/summary.md
            performance.log
            toolchain.txt
          if-no-files-found: warn
          retention-days: 30
