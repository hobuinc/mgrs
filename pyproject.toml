[project]
name = "mgrs"
description = "MGRS coordinate conversion for Python"
readme = "README.rst"
requires-python = ">=3.9"
dependencies = []
license = {file = "LICENSE"}
keywords = ["gis", "coordinate", "conversion"]
authors = [
  {email = "howard@hobu.co"},
  {name = "Howard Butler"}
]
maintainers = [
  {name = "Howard Butler", email = "howard@hobu.co"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: GIS",
]
dynamic = ["version"]

[project.urls]
repository = "https://github.com/hobuinc/mgrs/"
changelog = "https://github.com/hobuinc/mgrs/commits/main/"

[build-system]
requires = ["scikit-build-core>=1.0", "pybind11>=3.1"]
build-backend = "scikit_build_core.build"


[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
wheel.packages = ["mgrs"]
# Ship source and tooling only, never scratch files or generated binaries/data.
sdist.include = [
    "/CMakeLists.txt", "/pyproject.toml", "/README.rst", "/LICENSE",
    "/tox.ini", "/.gitignore", "/.github/**/*.yml", "/ci/*.sh", "/ci/*.bat",
    "/mgrs/*.py", "/src/*.cpp", "/libmgrs/*.c", "/libmgrs/*.h",
    "/tests/*.py", "/tests/*.txt", "/benchmarks/*.py", "/benchmarks/*.rst",
    "/benchmarks/requirements-ci.txt",
]
sdist.exclude = ["*"]

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "mgrs/__init__.py"

[tool.cibuildwheel]
test-requires = "pytest"
test-command = "python -m pytest tests --doctest-glob='*.txt'"
test-sources = ["tests", "benchmarks"]
